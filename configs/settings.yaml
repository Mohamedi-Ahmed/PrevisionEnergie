project:
  name: energy-forecast-project
  environment: dev

storage:
  backend: local
  base_path: ./data

database:
  url: sqlite:///./energy_forecast.db

api:
  title: Energy Forecast API
  version: 0.1.0
  prefix: /api/v1
  docs_url: /docs
  redoc_url: /redoc

pipelines:
  bronze_enabled: true
  silver_enabled: true
  gold_enabled: false
  silver:
    output_format: csv
    write_quality_report: true

features:
  calendar:
    weekend: true
    month: true
    weekday: true
  dju:
    heating_base_temperature: 18.0
    cooling_base_temperature: 24.0
